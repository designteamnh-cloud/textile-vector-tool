<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Textile Vector Studio</title>

    <!-- Professional Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Image Tracing Engine -->
    <script
        src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"
    ></script>

    <!-- PDF Engine -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ======================================================
     APP HEADER
====================================================== -->

<header class="app-header">

    <div class="brand">

        <div class="brand-mark">
            TV
        </div>

        <div>
            <div class="brand-name">
                Textile Vector
            </div>

            <div class="brand-subtitle">
                DESIGN STUDIO
            </div>
        </div>

    </div>


    <div class="header-center">

        <span class="status-dot"></span>

        <span id="appStatus">
            Ready to design
        </span>

    </div>


    <div class="header-actions">

        <button
            class="header-button"
            id="newDesignBtn"
        >
            + New Design
        </button>

    </div>

</header>


<!-- ======================================================
     MAIN APP
====================================================== -->

<div class="workspace">


    <!-- ==================================================
         LEFT SIDEBAR
    ================================================== -->

    <aside class="sidebar left-sidebar">

        <div class="sidebar-scroll">


            <!-- PROJECT -->
            <div class="panel-section">

                <div class="section-title">
                    PROJECT
                </div>

                <div class="upload-box" id="dropZone">

                    <div class="upload-symbol">
                        ↑
                    </div>

                    <div class="upload-title">
                        Upload Artwork
                    </div>

                    <div class="upload-description">
                        Drop image here or browse
                    </div>

                    <button
                        class="browse-button"
                        id="browseButton"
                    >
                        Choose Photo
                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        accept="image/png,image/jpeg,image/webp"
                        hidden
                    >

                    <div class="file-types">
                        JPG · PNG · WEBP
                    </div>

                </div>

            </div>


            <!-- IMAGE ADJUSTMENTS -->
            <div class="panel-section">

                <div class="section-title">
                    IMAGE ADJUSTMENTS
                </div>


                <div class="tool-row">

                    <button
                        class="tool-button"
                        id="cropButton"
                    >
                        <span>⌗</span>
                        Crop
                    </button>

                    <button
                        class="tool-button"
                        id="rotateButton"
                    >
                        <span>↻</span>
                        Rotate
                    </button>

                </div>


                <div class="slider-control">

                    <div class="slider-label">

                        <span>
                            Brightness
                        </span>

                        <span id="brightnessValue">
                            0
                        </span>

                    </div>

                    <input
                        type="range"
                        id="brightness"
                        min="-100"
                        max="100"
                        value="0"
                    >

                </div>


                <div class="slider-control">

                    <div class="slider-label">

                        <span>
                            Contrast
                        </span>

                        <span id="contrastValue">
                            0
                        </span>

                    </div>

                    <input
                        type="range"
                        id="contrast"
                        min="-100"
                        max="100"
                        value="0"
                    >

                </div>


                <button
                    class="wide-tool-button"
                    id="backgroundButton"
                >
                    <span>◐</span>
                    Remove Background
                </button>


                <button
                    class="wide-tool-button"
                    id="bwButton"
                >
                    <span>◒</span>
                    Black & White
                </button>

            </div>


            <!-- VECTOR SETTINGS -->
            <div class="panel-section">

                <div class="section-title">
                    VECTOR SETTINGS
                </div>


                <div class="select-control">

                    <label>
                        Color Mode
                    </label>

                    <select id="colorMode">

                        <option value="RGB">
                            RGB
                        </option>

                        <option value="CMYK">
                            CMYK Preview
                        </option>

                        <option value="BW">
                            Black & White
                        </option>

                    </select>

                </div>


                <div class="slider-control">

                    <div class="slider-label">

                        <span>
                            Color Count
                        </span>

                        <span id="colorCountValue">
                            8
                        </span>

                    </div>

                    <input
                        type="range"
                        id="colorCount"
                        min="2"
                        max="32"
                        value="8"
                    >

                </div>


                <div class="select-control">

                    <label>
                        Detail
                    </lab
